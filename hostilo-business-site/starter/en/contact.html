<body>
<!-- header -->
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="logo" href="/en/">Firma Przykład</a>
    <nav class="menu" aria-label="Menu">
      <a href="/en/">Home</a>
      <a href="/en/about">About us</a>

    <nav class="lang" aria-label="Language">

      <a href="/en/contact" hreflang="en" lang="en" aria-current="true">EN</a>
    </nav>
  </div>
</header>
<!-- /header -->
<main id="main">
<section class="wrap page"><h1>Contact</h1>
<p>Write to us, we usually reply within one business day.</p>
<form class="contact-form" action="https://hostilo.app/api_form.php" method="POST">
  <!-- SITE_TOKEN: the site's own token from get_site ("Contact form") or the Hostilo dashboard -->
  <input type="hidden" name="site_token" value="SITE_TOKEN">
  <input type="hidden" name="_next" value="https://example.com/en/thank-you">
  <input type="text" name="_honey" tabindex="-1" autocomplete="off" style="display:none">
  <label for="f-name">Name</label>
  <input id="f-name" name="name" autocomplete="name">
  <label for="f-email">E-mail *</label>
  <input id="f-email" name="email" type="email" required autocomplete="email">
  <label for="f-company">Company</label>
  <input id="f-company" name="company" autocomplete="organization">
  <label for="f-msg">Message *</label>
  <textarea id="f-msg" name="message" required maxlength="5000" rows="6"></textarea>
  <label class="check"><input type="checkbox" name="consent" value="yes" required> I agree to be contacted about my enquiry. <a href="/polityka-prywatnosci">Privacy policy</a></label>
  <button class="btn" type="submit">Send</button>
</form></section>
</main>
<!-- footer -->
<footer class="site-footer">
  <div class="wrap"><p>© 2026 Firma Przykład sp. z o.o. · ul. Przykładowa 1, 00-001 Warsaw, Poland · <a href="mailto:office@example.com">office@example.com</a></p></div>
</footer>
<!-- /footer -->
</body>
